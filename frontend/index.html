<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Objetos Perdidos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">Objetos Perdidos</h3>
            <p class="text-muted small">Ingresa con tu cuenta universitaria</p>
        </div>

        <!-- Alerta para mensajes de error o éxito -->
        <div id="alerta" class="alert d-none" role="alert"></div>

        <form id="formLogin">
            <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="correo" placeholder="carlos@universidad.edu" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-semibold">Iniciar Sesión</button>
        </form>

        <div class="mt-3 text-center">
            <small class="text-muted">Prueba: carlos@universidad.edu / 123456</small>
        </div>
    </div>

    <!-- Conexión con nuestro archivo JavaScript -->
    <script src="js/auth.js"></script>
</body>
</html>
